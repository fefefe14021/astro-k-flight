  <line x1="16" y1="6" x2="464" y2="6" stroke="#FFF" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round"/>
  <!-- Corner Tech Accent Dots -->
  <circle cx="16" cy="14" r="2" fill="#FFE082"/>
  <circle cx="464" cy="14" r="2" fill="#FFE082"/>
  <!-- Content Placeholder (Text) -->
  <text x="240" y="39" font-family="'JetBrains Mono', 'Roboto', 'Segoe UI', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">БОЕВАЯ КАМПАНИЯ</text>
</svg>
