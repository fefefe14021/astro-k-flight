<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 36" width="320" height="36" fill="none">
  <defs>
    <linearGradient id="hypeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C4DFF"/>
      <stop offset="50%" stop-color="#E040FB"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
  </defs>
  <!-- Frame -->
  <rect x="2" y="2" width="316" height="32" rx="4" fill="#0B101D" stroke="#37474F" stroke-width="1.8"/>
  <!-- Fill (e.g. 70%) -->
  <rect x="5" y="5" width="220" height="26" rx="2" fill="url(#hypeGrad)"/>
  <!-- Markers for EX (33%) and SUPER (100%) -->
  <line x1="108" y1="2" x2="108" y2="34" stroke="#FFE082" stroke-width="2"/>
  <line x1="212" y1="2" x2="212" y2="34" stroke="#FFE082" stroke-width="2"/>
  <!-- Label -->
  <text x="12" y="22" font-family="'JetBrains Mono', sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" letter-spacing="1">ЯРОСТЬ // SUPER</text>
</svg>
