<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <defs>
    <radialGradient id="hangarBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0E1A2E"/>
      <stop offset="100%" stop-color="#02050A"/>
    </radialGradient>
    <linearGradient id="hangarCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1526" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050A14" stop-opacity="0.98"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#hangarBg)"/>

  <!-- ================= TOP HEADER ================= -->
  <rect x="0" y="0" width="1920" height="74" fill="#060C17" fill-opacity="0.9"/>
  <line x1="0" y1="74" x2="1920" y2="74" stroke="#00E5FF" stroke-width="2"/>

  <!-- Back to Menu Button -->
  <g transform="translate(40, 16)">
    <rect width="160" height="42" rx="6" fill="#0E1B2E" stroke="#00E5FF" stroke-width="1.5"/>
    <text x="80" y="27" font-family="'JetBrains Mono', sans-serif" font-weight="700" font-size="15" fill="#00E5FF" text-anchor="middle">← В МЕНЮ</text>
  </g>

  <!-- Title Center -->
  <text x="960" y="46" font-family="'JetBrains Mono', sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">КОСМИЧЕСКИЙ АНГАР И АРСЕНАЛ</text>

  <!-- Right Currencies -->
  <g transform="translate(1500, 16)">
    <rect width="170" height="42" rx="6" fill="#0E1B2E" stroke="#FFB300" stroke-width="1.5"/>
    <polygon points="24,12 34,18 34,30 24,36 14,30 14,18" fill="#FFB300"/>
    <text x="44" y="27" font-family="'JetBrains Mono', sans-serif" font-weight="800" font-size="16" fill="#FFD54F">1,240</text>
  </g>
  <g transform="translate(1700, 16)">
    <rect width="180" height="42" rx="6" fill="#180C28" stroke="#D500F9" stroke-width="1.5"/>
    <polygon points="24,10 28,20 38,24 28,28 24,38 20,28 10,24 20,20" fill="#E040FB"/>
    <text x="46" y="27" font-family="'JetBrains Mono', sans-serif" font-weight="800" font-size="16" fill="#EA80FC">14 ЯДЕР</text>
  </g>

  <!-- ================= LEFT: WEAPON ARSENAL GRID ================= -->
  <g transform="translate(80, 120)">
    <rect width="520" height="880" rx="10" fill="url(#hangarCardBg)" stroke="#00E5FF" stroke-width="2"/>
    <text x="40" y="50" font-family="'JetBrains Mono', sans-serif" font-weight="900" font-size="20" fill="#00E5FF" letter-spacing="1">АРСЕНАЛ ВООРУЖЕНИЯ</text>
    <line x1="40" y1="70" x2="480" y2="70" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Weapon Item 1 (Selected) -->
    <g transform="translate(30, 90)">
      <rect width="460" height="150" rx="8" fill="#0D1E36" stroke="#00E5FF" stroke-width="2"/>
      <rect x="20" y="20" width="70" height="70" rx="6" fill="#060C17" stroke="#00E5FF" stroke-width="1.5"/>
      <circle cx="55" cy="55" r="18" fill="#00E5FF" fill-opacity="0.3"/>
      <text x="110" y="44" font-family="'JetBrains Mono', sans-serif" font-weight="800" font-size="17" fill="#FFFFFF">Двойной Бластер</text>
      <text x="110" y="68" font-family="'JetBrains Mono', sans-serif" font-weight="600" font-size="13" fill="#80D8FF">Уровень 2 / 3</text>
      <text x="110" y="90" font-family="sans-serif" font-size="12" fill="#B0BEC5">Урон: 3 | Скорострельность: 10 выстр/сек</text>
      <!-- Upgrade Button -->
      <rect x="290" y="100" width="150" height="36" rx="6" fill="#FFB800" stroke="#FFE082" stroke-width="1"/>
      <text x="365" y="123" font-family="'JetBrains Mono', sans-serif" font-weight="800" font-size="12" fill="#000" text-anchor="middle">АПГРЕЙД: 400 ОСК</text>
      <!-- Status Badge -->
      <rect x="20" y="104" width="100" height="26" rx="4" fill="#00E5FF" fill-opacity="0.2"/>
      <text x="70" y="121" font-family="'JetBrains Mono', sans-serif" font-weight="700" font-size="11" fill="#00E5FF" text-anchor="middle">УСТАНОВЛЕНО</text>
    </g>

    <!-- Weapon Item 2 -->
    <g transform="translate(30, 260)">
      <rect width="460" height="150" rx="8" fill="#08101E" stroke="#1E385B" stroke-width="1.5"/>
      <rect x="20" y="20" width="70" height="70" rx="6" fill="#060C17" stroke="#1E385B" stroke-width="1"/>
      <polygon points="55,35 70,65 40,65" fill="#00E5FF" fill-opacity="0.4"/>
      <text x="110" y="44" font-family="'JetBrains Mono', sans-serif" font-weight="800" font-size="17" fill="#CFD8DC">Плазменный Спрей</text>
      <text x="110" y="68" font-family="'JetBrains Mono', sans-serif" font-weight="600" font-size="13" fill="#78909C">Уровень 1 / 3</text>
      <text x="110" y="90" font-family="sans-serif" font-size="12" fill="#78909C">Широкий сектор поражения против роев.</text>
      <rect x="330" y="100" width="110" height="36" rx="6" fill="#00E5FF" fill-opacity="0.2" stroke="#00E5FF" stroke-width="1"/>
      <text x="385" y="123" font-family="'JetBrains Mono', sans-serif" font-weight="700" font-size="12" fill="#00E5FF" text-anchor="middle">ВЫБРАТЬ</text>
    </g>

    <!-- Weapon Item 3 -->
    <g transform="translate(30, 430)">
      <rect width="460" height="150" rx="8" fill="#08101E" stroke="#1E385B" stroke-width="1.5"/>
      <rect x="20" y="20" width="70" height="70" rx="6" fill="#060C17" stroke="#1E385B" stroke-width="1"/>
      <line x1="35" y1="55" x2="75" y2="55" stroke="#FF5252" stroke-width="4"/>
      <text x="110" y="44" font-family="'JetBrains Mono', sans-serif" font-weight="800" font-size="17" fill="#CFD8DC">Тяжёлый Рельсотрон</text>
      <text x="110" y="68" font-family="'JetBrains Mono', sans-serif" font-weight="600" font-size="13" fill="#78909C">Уровень 1 / 3</text>
      <text x="110" y="90" font-family="sans-serif" font-size="12" fill="#78909C">Пронзает врагов насквозь мощным лучом.</text>
      <rect x="330" y="100" width="110" height="36" rx="6" fill="#00E5FF" fill-opacity="0.2" stroke="#00E5FF" stroke-width="1"/>
      <text x="385" y="123" font-family="'JetBrains Mono', sans-serif" font-weight="700" font-size="12" fill="#00E5FF" text-anchor="middle">ВЫБРАТЬ</text>
    </g>
  </g>

  <!-- ================= CENTER: 3D SHIP DOCK PREVIEW ================= -->
  <g transform="translate(960, 480)">
    <!-- Rotating Cyber Ring -->
    <ellipse cx="0" cy="180" rx="280" ry="40" fill="#00E5FF" fill-opacity="0.08" stroke="#00E5FF" stroke-width="2"/>
    <ellipse cx="0" cy="180" rx="220" ry="30" fill="none" stroke="#80D8FF" stroke-width="1.5" stroke-dasharray="14 8"/>
    <!-- Ship Model -->
    <path d="M-130 -30 C-40 -50 80 -45 150 0 C80 45 -40 50 -130 30 C-155 20 -155 -20 -130 -30 Z" fill="#1E3A5F" stroke="#00E5FF" stroke-width="3.5"/>
    <ellipse cx="15" cy="-8" rx="60" ry="24" fill="#00E5FF" fill-opacity="0.3" stroke="#80D8FF" stroke-width="2"/>
    <!-- Engine Exhaust -->
    <path d="M-140 0 L-220 -16 L-190 0 L-220 16 Z" fill="#00E5FF" opacity="0.8"/>
  </g>

  <!-- Center Ship Stats Box -->
  <g transform="translate(680, 760)">
    <rect width="560" height="240" rx="10" fill="url(#hangarCardBg)" stroke="#00E5FF" stroke-width="1.8"/>
    <text x="40" y="40" font-family="'JetBrains Mono', sans-serif" font-weight="800" font-size="18" fill="#FFB800">ТЕХНИЧЕСКИЙ ПАСПОРТ СУДНА</text>
    <!-- Stat 1: Hull -->
    <text x="40" y="80" font-family="sans-serif" font-size="14" fill="#B0BEC5">Прочность корпуса:</text>
    <rect x="220" y="68" width="280" height="14" rx="3" fill="#060C17"/>
    <rect x="220" y="68" width="200" height="14" rx="3" fill="#00E676"/>
    <!-- Stat 2: Speed -->
    <text x="40" y="115" font-family="sans-serif" font-size="14" fill="#B0BEC5">Манёвренность / Скорость:</text>
    <rect x="220" y="103" width="280" height="14" rx="3" fill="#060C17"/>
    <rect x="220" y="103" width="240" height="14" rx="3" fill="#00E5FF"/>
    <!-- Stat 3: Reactor -->
    <text x="40" y="150" font-family="sans-serif" font-size="14" fill="#B0BEC5">Генератор Ярости:</text>
    <rect x="220" y="138" width="280" height="14" rx="3" fill="#060C17"/>
    <rect x="220" y="138" width="160" height="14" rx="3" fill="#E040FB"/>
    <!-- Stat 4: Magnet -->
    <text x="40" y="185" font-family="sans-serif" font-size="14" fill="#B0BEC5">Радиус захвата нанитов:</text>
    <rect x="220" y="173" width="280" height="14" rx="3" fill="#060C17"/>
    <rect x="220" y="173" width="180" height="14" rx="3" fill="#FFB800"/>
  </g>

  <!-- ================= RIGHT: HULL SKINS & COSMETICS ================= -->
  <g transform="translate(1320, 120)">
    <rect width="520" height="880" rx="10" fill="url(#hangarCardBg)" stroke="#00E5FF" stroke-width="2"/>
    <text x="40" y="50" font-family="'JetBrains Mono', sans-serif" font-weight="900" font-size="20" fill="#00E5FF" letter-spacing="1">ОБЛИКИ КОРПУСА</text>
    <line x1="40" y1="70" x2="480" y2="70" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Skin 1: Default (Equipped) -->
    <g transform="translate(30, 90)">
      <rect width="460" height="110" rx="8" fill="#0D1E36" stroke="#00E5FF" stroke-width="1.8"/>
      <circle cx="55" cy="55" r="28" fill="#1C314E" stroke="#00E5FF" stroke-width="2"/>
      <text x="105" y="48" font-family="'JetBrains Mono', sans-serif" font-weight="800" font-size="16" fill="#FFFFFF">Базовый Корпус</text>
      <text x="105" y="70" font-family="sans-serif" font-size="13" fill="#80D8FF">Стандартная заводская сборка Astro K</text>
      <rect x="340" y="38" width="100" height="34" rx="6" fill="#00E5FF" fill-opacity="0.2"/>
      <text x="390" y="60" font-family="'JetBrains Mono', sans-serif" font-weight="700" font-size="12" fill="#00E5FF" text-anchor="middle">АКТИВЕН</text>
    </g>

    <!-- Skin 2: Cyber Neon (Unlocked) -->
    <g transform="translate(30, 220)">
      <rect width="460" height="110" rx="8" fill="#08101E" stroke="#1E385B" stroke-width="1.5"/>
      <circle cx="55" cy="55" r="28" fill="#00E5FF" stroke="#FFFFFF" stroke-width="2"/>
      <text x="105" y="48" font-family="'JetBrains Mono', sans-serif" font-weight="800" font-size="16" fill="#CFD8DC">Неоновый Киберпанк</text>
      <text x="105" y="70" font-family="sans-serif" font-size="13" fill="#78909C">Люминесцентные ионные дорожки</text>
      <rect x="340" y="38" width="100" height="34" rx="6" fill="#00E5FF" fill-opacity="0.2" stroke="#00E5FF" stroke-width="1"/>
      <text x="390" y="60" font-family="'JetBrains Mono', sans-serif" font-weight="700" font-size="12" fill="#00E5FF" text-anchor="middle">ВЫБРАТЬ</text>
    </g>

    <!-- Skin 3: Void Reaper (Locked - Star Cores) -->
    <g transform="translate(30, 350)">
      <rect width="460" height="110" rx="8" fill="#08101E" stroke="#1E385B" stroke-width="1.5"/>
      <circle cx="55" cy="55" r="28" fill="#7C4DFF" stroke="#D500F9" stroke-width="2"/>
      <text x="105" y="48" font-family="'JetBrains Mono', sans-serif" font-weight="800" font-size="16" fill="#CFD8DC">Тёмная Материя</text>
      <text x="105" y="70" font-family="sans-serif" font-size="13" fill="#78909C">Корпус из гравитационного монолита</text>
      <rect x="310" y="38" width="130" height="34" rx="6" fill="#D500F9" fill-opacity="0.2" stroke="#D500F9" stroke-width="1.5"/>
      <text x="375" y="60" font-family="'JetBrains Mono', sans-serif" font-weight="800" font-size="12" fill="#EA80FC" text-anchor="middle">КУПИТЬ: 5 ЯДЕР</text>
    </g>
  </g>
</svg>
