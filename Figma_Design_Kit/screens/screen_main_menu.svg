<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="spaceGlow" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#142038"/>
      <stop offset="50%" stop-color="#080C16"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <linearGradient id="primaryBtnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9E00"/>
      <stop offset="50%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#D34500"/>
    </linearGradient>
    <linearGradient id="secBtnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D1E36"/>
      <stop offset="100%" stop-color="#060C17"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A1324" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#04070D" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Space Canvas -->
  <rect width="1920" height="1080" fill="url(#spaceGlow)"/>

  <!-- Subtle Perspective Starfield Grid -->
  <g opacity="0.15" stroke="#00E5FF" stroke-width="1">
    <line x1="0" y1="200" x2="1920" y2="200"/>
    <line x1="0" y1="400" x2="1920" y2="400"/>
    <line x1="0" y1="600" x2="1920" y2="600"/>
    <line x1="0" y1="800" x2="1920" y2="800"/>
    <line x1="0" y1="1000" x2="1920" y2="1000"/>
    <line x1="300" y1="0" x2="300" y2="1080"/>
    <line x1="600" y1="0" x2="600" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1320" y1="0" x2="1320" y2="1080"/>
    <line x1="1620" y1="0" x2="1620" y2="1080"/>
  </g>

  <!-- Stars -->
  <g fill="#FFFFFF" opacity="0.6">
    <circle cx="120" cy="80" r="1.5"/><circle cx="450" cy="180" r="1"/><circle cx="890" cy="90" r="2"/>
    <circle cx="1400" cy="140" r="1.5"/><circle cx="1780" cy="90" r="2"/><circle cx="220" cy="550" r="1"/>
    <circle cx="820" cy="720" r="1.5"/><circle cx="1250" cy="890" r="1"/><circle cx="1680" cy="650" r="2"/>
  </g>

  <!-- ================= TOP HEADER BAR ================= -->
  <rect x="0" y="0" width="1920" height="74" fill="#060C17" fill-opacity="0.9"/>
  <line x1="0" y1="74" x2="1920" y2="74" stroke="#00E5FF" stroke-width="2"/>

  <!-- Left: Pilot Dossier Badge -->
  <rect x="40" y="15" width="280" height="44" rx="6" fill="#0E1B2E" stroke="#1E385B" stroke-width="1.5"/>
  <!-- Rank Medal Icon -->
  <circle cx="66" cy="37" r="12" fill="#FFB800" fill-opacity="0.2" stroke="#FFB800" stroke-width="1.5"/>
  <polygon points="66,29 69,35 75,35 70,39 72,45 66,41 60,45 62,39 57,35 63,35" fill="#FFD54F"/>
  <text x="90" y="34" font-family="'JetBrains Mono', sans-serif" font-weight="700" font-size="13" fill="#80D8FF">РАНГ ПИЛОТА</text>
  <text x="90" y="49" font-family="'JetBrains Mono', sans-serif" font-weight="800" font-size="14" fill="#FFFFFF">ВЕТЕРАН (СБИТО: 142)</text>

  <!-- Center: Player Tag & Auth -->
  <rect x="800" y="16" width="320" height="42" rx="6" fill="#0A1424" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="826" cy="37" r="10" fill="#00E5FF" fill-opacity="0.3"/>
  <text x="846" y="42" font-family="'JetBrains Mono', sans-serif" font-weight="600" font-size="14" fill="#E0F7FA">ПИЛОТ: ГОСТЬ</text>
  <!-- Auth Button -->
  <rect x="990" y="21" width="120" height="32" rx="4" fill="#00E5FF" fill-opacity="0.2" stroke="#00E5FF" stroke-width="1.5"/>
  <text x="1050" y="42" font-family="'JetBrains Mono', sans-serif" font-weight="700" font-size="13" fill="#00E5FF" text-anchor="middle">ВОЙТИ</text>

  <!-- Right: Currency Counters -->
  <!-- Soft Currency: Quantum Shards -->
  <rect x="1460" y="16" width="190" height="42" rx="6" fill="#0E1B2E" stroke="#FFB300" stroke-width="1.5"/>
  <polygon points="1482,24 1494,30 1494,44 1482,50 1470,44 1470,30" fill="#FFB300" stroke="#FFE082" stroke-width="1"/>
  <text x="1506" y="42" font-family="'JetBrains Mono', sans-serif" font-weight="800" font-size="16" fill="#FFD54F">1,240</text>
  <!-- Hard Currency: Star Cores -->
  <rect x="1670" y="16" width="180" height="42" rx="6" fill="#180C28" stroke="#D500F9" stroke-width="1.5"/>
  <polygon points="1692,23 1696,33 1706,37 1696,41 1692,51 1688,41 1678,37 1688,33" fill="#E040FB" stroke="#EA80FC" stroke-width="1"/>
  <text x="1716" y="42" font-family="'JetBrains Mono', sans-serif" font-weight="800" font-size="16" fill="#EA80FC">14 ЯДЕР</text>

  <!-- ================= LEFT: HANGAR SHOWCASE ================= -->
  <!-- Game Logo -->
  <g transform="translate(200, 140)">
    <text x="260" y="60" font-family="'JetBrains Mono', sans-serif" font-weight="900" font-size="52" fill="#FFB800" text-anchor="middle" letter-spacing="4">ASTRO K</text>
    <text x="260" y="96" font-family="'JetBrains Mono', sans-serif" font-weight="800" font-size="22" fill="#00E5FF" text-anchor="middle" letter-spacing="6">FLIGHT HOME</text>
    <line x1="60" y1="112" x2="460" y2="112" stroke="#00E5FF" stroke-width="2" stroke-opacity="0.6"/>
  </g>

  <!-- Holographic Platform -->
  <g transform="translate(460, 520)">
    <!-- Cyan Bevel Ring -->
    <ellipse cx="0" cy="70" rx="220" ry="24" fill="#00E5FF" fill-opacity="0.1" stroke="#00E5FF" stroke-width="2" filter="url(#neonGlow)"/>
    <ellipse cx="0" cy="70" rx="160" ry="16" fill="none" stroke="#80D8FF" stroke-width="1.5" stroke-dasharray="10 6"/>

    <!-- Spaceship Silhouette / Graphic (Saucer Fighter) -->
    <!-- Thruster Flame -->
    <path d="M-110 0 L-180 -12 L-150 0 L-180 12 Z" fill="#00E5FF" filter="url(#neonGlow)"/>
    <!-- Ship Hull -->
    <path d="M-100 -25 C-30 -40 60 -35 110 0 C60 35 -30 40 -100 25 C-120 15 -120 -15 -100 -25 Z" fill="#1C314E" stroke="#00E5FF" stroke-width="3"/>
    <!-- Cockpit Dome -->
    <ellipse cx="10" cy="-6" rx="45" ry="18" fill="#00E5FF" fill-opacity="0.3" stroke="#80D8FF" stroke-width="2"/>
    <ellipse cx="20" cy="-10" rx="20" ry="6" fill="#FFFFFF" fill-opacity="0.6"/>
    <!-- Wing Blasters -->
    <rect x="-30" y="-36" width="30" height="6" rx="2" fill="#00E5FF"/>
    <rect x="-30" y="30" width="30" height="6" rx="2" fill="#00E5FF"/>
  </g>

  <!-- Skin Label -->
  <rect x="340" y="640" width="240" height="34" rx="4" fill="#0A1526" stroke="#00E5FF" stroke-width="1"/>
  <text x="460" y="662" font-family="'JetBrains Mono', sans-serif" font-weight="700" font-size="14" fill="#80D8FF" text-anchor="middle">КОРПУС: КИБЕР-ПАНК</text>

  <!-- Sector Progress Card -->
  <g transform="translate(180, 720)">
    <rect width="560" height="150" rx="10" fill="url(#cardGrad)" stroke="#00E5FF" stroke-width="2"/>
    <path d="M4 16 V4 H24" stroke="#00E5FF" stroke-width="3"/>
    <path d="M556 16 V4 H536" stroke="#00E5FF" stroke-width="3"/>
    <text x="30" y="42" font-family="'JetBrains Mono', sans-serif" font-weight="800" font-size="18" fill="#FFB800" letter-spacing="1">ТЕКУЩИЙ СЕКТОР 01: НЕОНОВЫЙ КОРИДОР</text>
    <text x="30" y="76" font-family="sans-serif" font-size="14" fill="#B0BEC5">Astro K выходит из доков Neon City.</text>
    <text x="30" y="98" font-family="sans-serif" font-size="14" fill="#78909C">Уничтожьте боевой патруль и перехватите гипер-врата.</text>
    <!-- Difficulty / Reward Badge -->
    <rect x="30" y="114" width="120" height="22" rx="3" fill="#00E5FF" fill-opacity="0.15"/>
    <text x="90" y="129" font-family="'JetBrains Mono', sans-serif" font-weight="700" font-size="11" fill="#00E5FF" text-anchor="middle">НАГРАДА: 50 ОСК</text>
  </g>

  <!-- ================= RIGHT: COMMAND CONSOLE ================= -->
  <g transform="translate(1220, 240)">
    <!-- 1. CAMPAIGN BUTTON (Primary Orange) -->
    <g transform="translate(0, 0)">
      <path d="M14 2 H486 L498 14 V58 L486 70 H14 L2 58 V14 L14 2 Z" fill="url(#primaryBtnGrad)" stroke="#FFE082" stroke-width="2.5" filter="url(#neonGlow)"/>
      <circle cx="48" cy="36" r="14" fill="#FFD54F" fill-opacity="0.3" stroke="#FFF" stroke-width="1.8"/>
      <circle cx="48" cy="36" r="5" fill="#FFF"/>
      <text x="82" y="44" font-family="'JetBrains Mono', sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" letter-spacing="2">БОЕВАЯ КАМПАНИЯ</text>
    </g>

    <!-- 2. ROGUE EXPEDITION BUTTON (Primary Cyan/Purple) -->
    <g transform="translate(0, 95)">
      <linearGradient id="rogueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00B0FF"/>
        <stop offset="100%" stop-color="#7C4DFF"/>
      </linearGradient>
      <path d="M14 2 H486 L498 14 V58 L486 70 H14 L2 58 V14 L14 2 Z" fill="url(#rogueGrad)" stroke="#80D8FF" stroke-width="2.5"/>
      <circle cx="48" cy="36" r="14" fill="#FFF" fill-opacity="0.2" stroke="#FFF" stroke-width="1.8"/>
      <path d="M48 26 C42 26 38 30 38 36 C38 42 42 46 48 46" stroke="#FFF" stroke-width="2"/>
      <text x="82" y="44" font-family="'JetBrains Mono', sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" letter-spacing="2">РОГАЛИК: ЭКСПЕДИЦИЯ</text>
    </g>

    <!-- 3. HANGAR & ARSENAL BUTTON -->
    <g transform="translate(0, 190)">
      <path d="M10 2 H490 L498 10 V44 L490 52 H10 L2 44 V10 L10 2 Z" fill="url(#secBtnGrad)" stroke="#00E5FF" stroke-width="1.8"/>
      <!-- Icon -->
      <polygon points="48,16 58,40 48,35 38,40" fill="#00E5FF"/>
      <text x="82" y="34" font-family="'JetBrains Mono', sans-serif" font-weight="700" font-size="18" fill="#E1F5FE" letter-spacing="1">АНГАР И АРСЕНАЛ</text>
    </g>

    <!-- 4. FLIGHT LOG / LORE BUTTON -->
    <g transform="translate(0, 265)">
      <path d="M10 2 H490 L498 10 V44 L490 52 H10 L2 44 V10 L10 2 Z" fill="url(#secBtnGrad)" stroke="#00E5FF" stroke-width="1.8"/>
      <rect x="38" y="16" width="20" height="24" rx="2" fill="none" stroke="#00E5FF" stroke-width="2"/>
      <line x1="42" y1="22" x2="54" y2="22" stroke="#00E5FF" stroke-width="1.5"/>
      <line x1="42" y1="28" x2="50" y2="28" stroke="#00E5FF" stroke-width="1.5"/>
      <text x="82" y="34" font-family="'JetBrains Mono', sans-serif" font-weight="700" font-size="18" fill="#E1F5FE" letter-spacing="1">БОРТОВОЙ ЖУРНАЛ И ЛОР</text>
    </g>

    <!-- 5. ACHIEVEMENTS BUTTON -->
    <g transform="translate(0, 340)">
      <path d="M10 2 H490 L498 10 V44 L490 52 H10 L2 44 V10 L10 2 Z" fill="url(#secBtnGrad)" stroke="#00E5FF" stroke-width="1.8"/>
      <polygon points="48,16 51,23 58,23 53,27 55,34 48,30 42,34 44,27 39,23 46,23" fill="#FFB800"/>
      <text x="82" y="34" font-family="'JetBrains Mono', sans-serif" font-weight="700" font-size="18" fill="#E1F5FE" letter-spacing="1">ДОСТИЖЕНИЯ</text>
    </g>

    <!-- 6. SETTINGS BUTTON -->
    <g transform="translate(0, 415)">
      <path d="M10 2 H490 L498 10 V44 L490 52 H10 L2 44 V10 L10 2 Z" fill="url(#secBtnGrad)" stroke="#00E5FF" stroke-width="1.8"/>
      <circle cx="48" cy="27" r="8" stroke="#90A4AE" stroke-width="2" stroke-dasharray="3 3"/>
      <text x="82" y="34" font-family="'JetBrains Mono', sans-serif" font-weight="700" font-size="18" fill="#E1F5FE" letter-spacing="1">НАСТРОЙКИ</text>
    </g>

    <!-- 7. EXIT GAME BUTTON -->
    <g transform="translate(0, 490)">
      <path d="M8 2 H492 L498 8 V40 L492 46 H8 L2 40 V8 L8 2 Z" fill="#1C0A10" stroke="#FF5252" stroke-width="1.5"/>
      <path d="M42 16 H36 V38 H42 M54 27 L46 22 V32 Z" stroke="#FF7043" stroke-width="2" fill="none"/>
      <text x="82" y="31" font-family="'JetBrains Mono', sans-serif" font-weight="700" font-size="16" fill="#FF8A80" letter-spacing="1">ВЫХОД ИЗ ИГРЫ</text>
    </g>
  </g>

  <!-- Footer / Status Bar -->
  <g transform="translate(40, 1045)">
    <circle cx="10" cy="0" r="5" fill="#00E676"/>
    <text x="24" y="4" font-family="'JetBrains Mono', sans-serif" font-size="13" fill="#90A4AE">YANDEX GAMES SDK // ОНЛАЙН</text>
    <text x="1800" y="4" font-family="'JetBrains Mono', sans-serif" font-size="13" fill="#546E7A" text-anchor="end">ASTRO K BUILD 2026.11 // V1.4.0</text>
  </g>
</svg>
