<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <defs>
    <radialGradient id="vicBackdrop" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0A1424" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020408" stop-opacity="0.98"/>
    </radialGradient>
    <linearGradient id="vicCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F1F38"/>
      <stop offset="100%" stop-color="#060C18"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </linearGradient>
    <filter id="gradeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#FFB800" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Backdrop -->
  <rect width="1920" height="1080" fill="url(#vicBackdrop)"/>

  <!-- Center Card (760x780) -->
  <g transform="translate(580, 150)">
    <path d="M20 2 H740 L758 20 V760 L740 778 H20 L2 760 V20 L20 2 Z" fill="url(#vicCardBg)" stroke="#00E5FF" stroke-width="2.5"/>
    <path d="M6 30 V6 H30" stroke="#00E5FF" stroke-width="3.5"/>
    <path d="M754 30 V6 H730" stroke="#00E5FF" stroke-width="3.5"/>

    <!-- Header Title -->
    <text x="380" y="60" font-family="'JetBrains Mono', sans-serif" font-weight="900" font-size="28" fill="#00E5FF" text-anchor="middle" letter-spacing="3">СЕКТОР ЗАЧИЩЕН // МИССИЯ ВЫПОЛНЕНА</text>
    <line x1="50" y1="85" x2="710" y2="85" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Grade Circle (Cuphead Grade S) -->
    <g transform="translate(380, 200)" filter="url(#gradeGlow)">
      <circle cx="0" cy="0" r="70" fill="#060C17" stroke="url(#goldGrad)" stroke-width="4"/>
      <text x="0" y="32" font-family="'JetBrains Mono', sans-serif" font-weight="900" font-size="92" fill="url(#goldGrad)" text-anchor="middle">S</text>
    </g>
    <text x="380" y="300" font-family="'JetBrains Mono', sans-serif" font-weight="800" font-size="18" fill="#FFE082" text-anchor="middle">ИДЕАЛЬНЫЙ РЕЗУЛЬТАТ: РАНГ S</text>

    <!-- Stats Table Box -->
    <g transform="translate(50, 330)">
      <rect width="660" height="230" rx="8" fill="#08101E" stroke="#1E385B" stroke-width="1.5"/>

      <!-- Row 1: Time -->
      <text x="30" y="45" font-family="'JetBrains Mono', sans-serif" font-size="16" fill="#80D8FF">⏱ ВРЕМЯ ПРОХОЖДЕНИЯ:</text>
      <text x="630" y="45" font-family="'JetBrains Mono', sans-serif" font-weight="800" font-size="16" fill="#FFFFFF" text-anchor="end">01:42 (ЗОЛОТО)</text>
      <line x1="30" y1="65" x2="630" y2="65" stroke="#1E385B" stroke-width="1"/>

      <!-- Row 2: Hull HP -->
      <text x="30" y="100" font-family="'JetBrains Mono', sans-serif" font-size="16" fill="#80D8FF">❤️ ЦЕЛОСТНОСТЬ КОРПУСА:</text>
      <text x="630" y="100" font-family="'JetBrains Mono', sans-serif" font-weight="800" font-size="16" fill="#00E676" text-anchor="end">3 / 3 (БЕЗ УРОНА)</text>
      <line x1="30" y1="120" x2="630" y2="120" stroke="#1E385B" stroke-width="1"/>

      <!-- Row 3: Parries -->
      <text x="30" y="155" font-family="'JetBrains Mono', sans-serif" font-size="16" fill="#80D8FF">⚡ ПАРИРОВАНИЙ ОТРАЖЕНО:</text>
      <text x="630" y="155" font-family="'JetBrains Mono', sans-serif" font-weight="800" font-size="16" fill="#FFD54F" text-anchor="end">7 ВЫСТРЕЛОВ</text>
      <line x1="30" y1="175" x2="630" y2="175" stroke="#1E385B" stroke-width="1"/>

      <!-- Row 4: Super Attacks -->
      <text x="30" y="210" font-family="'JetBrains Mono', sans-serif" font-size="16" fill="#80D8FF">💥 СВЕРХСПОСОБНОСТЕЙ SUPER:</text>
      <text x="630" y="210" font-family="'JetBrains Mono', sans-serif" font-weight="800" font-size="16" fill="#EA80FC" text-anchor="end">2 ЗАЛПА</text>
    </g>

    <!-- Rewards Badge -->
    <g transform="translate(50, 580)">
      <rect width="660" height="70" rx="8" fill="#142416" stroke="#00E676" stroke-width="1.8"/>
      <polygon points="40,24 50,30 50,42 40,48 30,42 30,30" fill="#FFB300"/>
      <text x="65" y="42" font-family="'JetBrains Mono', sans-serif" font-weight="800" font-size="18" fill="#FFD54F">+80 КВАНТОВЫХ ОСКОЛКОВ</text>
      <polygon points="460,24 464,32 472,36 464,40 460,48 456,40 448,36 456,32" fill="#E040FB"/>
      <text x="485" y="42" font-family="'JetBrains Mono', sans-serif" font-weight="800" font-size="18" fill="#EA80FC">+1 ЗВЁЗДНОЕ ЯДРО</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(50, 680)">
      <!-- Next Mission (Primary Gold) -->
      <rect x="0" y="0" width="320" height="60" rx="8" fill="#FF8F00" stroke="#FFE082" stroke-width="2"/>
      <text x="160" y="37" font-family="'JetBrains Mono', sans-serif" font-weight="800" font-size="16" fill="#000000" text-anchor="middle">СЛЕДУЮЩИЙ СЕКТОР →</text>

      <!-- Back to Hangar (Secondary Blue) -->
      <rect x="340" y="0" width="320" height="60" rx="8" fill="#0E1B2E" stroke="#00E5FF" stroke-width="2"/>
      <text x="500" y="37" font-family="'JetBrains Mono', sans-serif" font-weight="700" font-size="16" fill="#00E5FF" text-anchor="middle">ВЕРНУТЬСЯ В АНГАР</text>
    </g>
  </g>
</svg>
