<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>{{{ PRODUCT_NAME }}}</title>
  <!-- Официальный SDK Яндекс Игр v2 -->
  <script src="https://yandex.ru/games/sdk/v2"></script>
  <style>
    html, body, #unity-canvas {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070b14;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      outline: none;
    }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <script>
    // Блокировка контекстного меню и выделения (Пункты 1.6.1.8 и 1.6.2.7 Требований Яндекс Игр)
    document.addEventListener("contextmenu", function (e) { e.preventDefault(); }, false);

    // Автоопределение языка через SDK Яндекс Игр на старте страницы (Пункт 2.14 Требований)
    window.__yandexLang = "ru";
    window.__ysdk = null;

    if (typeof YaGames !== "undefined") {
      YaGames.init().then(function (ysdk) {
        window.__ysdk = ysdk;
        window.ysdk = ysdk;
        try {
          // Обязательное чтение environment.i18n.lang на этапе загрузки для прохождения модерации
          var detectedLang = ysdk.environment.i18n.lang;
          window.__yandexLang = detectedLang || "ru";
          console.log("[Yandex SDK] Автоопределение языка при запуске: " + window.__yandexLang);
        } catch (e) {
          console.warn("[Yandex SDK] Не удалось прочитать environment.i18n.lang: ", e);
        }
      }).catch(function (err) {
        console.warn("[Yandex SDK] Ошибка инициализации на этапе HTML: ", err);
      });
    }

    var canvas = document.querySelector("#unity-canvas");
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
    };

    var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config).then(function (instance) {
        window.unityInstance = instance;
        window.gameInstance = instance;
      }).catch(function (message) {
        console.error(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
